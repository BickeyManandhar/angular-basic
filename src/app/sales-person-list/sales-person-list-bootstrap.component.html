
<table class="table table-hover">
  <thead class="table-dark">
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Sales Amount</th>
      <th>Performance</th>
    </tr>
    </thead>
  <tbody>
    <tr *ngFor="let salesPerson of salesPersonList" [ngClass]="{'highlight-green': salesPerson.salesVolume>=7000, 'highlight-orange': salesPerson.salesVolume>=5000 && salesPerson.salesVolume<7000, 'highlight-red': salesPerson.salesVolume<5000}">
      <td>{{ salesPerson.firstName }}</td>
      <td>{{ salesPerson.lastName }}</td>
      <td>{{ salesPerson.email }}</td>
      <td>{{ salesPerson.salesVolume | currency: 'USD' }}</td>
      <td>
        <ng-container *ngIf="salesPerson.salesVolume > 7000; else midPerformer">
          Top Performer
        </ng-container>

        <ng-template #midPerformer>
          <ng-container *ngIf="salesPerson.salesVolume > 5000; else lowPerformer">
            Doing Good
          </ng-container>
        </ng-template>

        <ng-template #lowPerformer>
          Needs Improvement
        </ng-template>
      </td>
    </tr>
  </tbody>
</table>
