
<table class="table table-hover">
  <thead class="table-dark">
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Sales Amount</th>
      <th>Performance</th>
    </tr>
    </thead>
  <tbody>
    <tr *ngFor="let salesPerson of salesPersonList" [ngClass]="{'highlight': salesPerson.salesVolume>5000}">
      <td>{{ salesPerson.firstName }}</td>
      <td>{{ salesPerson.lastName }}</td>
      <td>{{ salesPerson.email }}</td>
      <td>{{ salesPerson.salesVolume | currency: 'USD' }}</td>
      <td>
        <div *ngIf="salesPerson.salesVolume > 5000 ; else myElseBlock"> Top Performer </div>
          <ng-template #myElseBlock> Doing Ok </ng-template>
      </td>
    </tr>
  </tbody>
</table>
